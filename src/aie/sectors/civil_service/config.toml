# Civil Service Statistics 2026 tables (data browser), as downloaded on 2026-09-28 by the
# original pipeline and used for release v2's weights and salaries. Copied into reference/.
[reference_sources]
"organisations.csv" = "~/Documents/gds-idea-ai-exposure/data/raw/organisations.csv"
"grades.csv" = "~/Documents/gds-idea-ai-exposure/data/raw/grades.csv"
"professions.csv" = "~/Documents/gds-idea-ai-exposure/data/raw/professions.csv"
"salaries.csv" = "~/Documents/gds-idea-ai-exposure/data/raw/salaries.csv"
"salaries_by_dept_grade_prof.csv" = "~/Documents/gds-idea-ai-exposure/data/raw/salaries_by_dept_grade_prof.csv"
"profession_by_dept.csv" = "~/Documents/gds-idea-ai-exposure/data/raw/profession_by_dept.csv"

[llm]
extract_system_prompt = """You are an expert on UK Civil Service work. Your job is to extract the tasks from a job \
advert and assess the automation potential of each with current AI systems."""
label_system_prompt = """You are an expert on UK Civil Service work. You classify tasks that were extracted from a \
job advert by how substantive each is to the role, so that non-meaningful items can be filtered \
out before analysis."""
