name = "Civil Service"
source = "Civil Service Jobs adverts (GRID extract), profession-corrected"
owner = "DSIT AI exposure team"

[scoring]
# CS headline numbers use the mean of 8 models. Cross-sector cuts use gpt-oss-120b, one of
# the 8, because it is the only model every sector has.
primary_model = "ensemble-8"
models = [
    "sonnet-4-6", "qwen-3-235b", "openai-oss-120b", "llama-maverick",
    "glm-5", "nova-2-lite", "nemotron-super", "ministral-14b-3",
]
# CS calls gpt-oss "openai-oss-120b"; the contract name is gpt-oss-120b.
rename_models = { "openai-oss-120b" = "gpt-oss-120b" }

[weighting]
primary_spec = "rake_1d"
target_source = "Civil Service Statistics data browser 2026 (dept x grade x profession)"
target_date = "2026"
# 1D IPF (primary) and 3D post-stratification, on adverts with at least MIN_TASKS tasks, as
# release v2's published weights were (weighting.py, rake.py, cs_stats.py).

[salary]
primary = "Civil Service Statistics mean salary, dept x grade x profession with fallbacks"

# CS releases.
#   v1  legacy: the original pipeline (role-level, single-model). Data only for now: inputs in
#       build/.../release=v1/raw/, tables (old schema) in curated/sector=civil-service/release=v1/.
#   v2  the current CS release (8-model ensemble on GRID adverts, raked 1D/3D). Built from raw
#       here since 2026-11-25 (grid_v2.py and the modules it calls), reproducing the release
#       first adopted from ai-exposure/v2/.
[releases]
v1 = "legacy"
v2 = "build"

[raw]
# Copied once from the pre-scaffold folders; the build reads only these copies.
files = [
    "v2/raw/170426 - UpdatedCivilServiceJobData.csv",
    "v2/raw/Matthew Professions.csv",
    "v2/raw/dsit_full_dept.xlsx",
    "v2/raw/grid_tasks_scored_ALL_MODELS_wide.parquet",
]
# The two profession_label_files below were uploaded straight to raw/ (2026-11-25) from the
# original run's Bedrock batch output; they are listed in [raw.notes].
grid_file = "170426 - UpdatedCivilServiceJobData.csv"
professions_file = "Matthew Professions.csv"
new_fields_file = "dsit_full_dept.xlsx"
scores_file = "grid_tasks_scored_ALL_MODELS_wide.parquet"
profession_label_files = [
    "profession-classification-full-batch-v2-1.jsonl.out",
    "profession-classification-full-batch-v2-2.jsonl.out",
]

# What each raw file is. "processed" = an earlier repo's output kept as an input or for
# reference (flagged in raw/README.md, which `aie build civil-service raw` writes).
[raw.notes."170426 - UpdatedCivilServiceJobData.csv"]
kind = "original"
note = "GRID export of Civil Service Jobs adverts (April 2026), as received from the GRID team. Cleaned by grid_cleaning.py."

[raw.notes."Matthew Professions.csv"]
kind = "original"
note = "GRID profession for each advert, as received from the GRID team with the export."

[raw.notes."dsit_full_dept.xlsx"]
kind = "original"
note = "Extra GRID fields per advert (number of posts, location, business area, salary range), as received. Joined in post_processing."

[raw.notes."grid_tasks_scored_ALL_MODELS_wide.parquet"]
kind = "processed"
note = """PROCESSED, not raw: the tasks extracted by Claude Sonnet 4.6 and scored by eight models \
(August 2026 Bedrock runs by gds-idea-ai-exposure, notebooks 1a and 1b), from the cleaned adverts \
the build now produces. Kept as an input so the LLM runs are not repeated."""

[raw.notes."profession-classification-full-batch-v2-1.jsonl.out"]
kind = "processed"
note = """PROCESSED, not raw: Bedrock batch output (Qwen 3 235B) classifying the profession of \
adverts GRID labels 'Other' (gds-idea-ai-exposure notebook 1d, August 2026), part 1 of 2. Parsed \
by professions.py."""

[raw.notes."profession-classification-full-batch-v2-2.jsonl.out"]
kind = "processed"
note = "PROCESSED, not raw: part 2 of 2 of the same profession classification run."

[raw.notes."canonical_vacancy_dataset.parquet"]
kind = "processed"
note = "PROCESSED, not raw: an output of the original gds-idea-ai-exposure pipeline, copied here when v2 was first adopted. Kept for reference; the build does not read it."

