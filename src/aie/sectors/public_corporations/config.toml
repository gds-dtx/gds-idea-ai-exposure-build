"ordnance_survey_annual_report_2024_25.pdf" = "https://assets.publishing.service.gov.uk/media/68778cca2bad77c3dae4dc61/OS_Annual_Report_2024_2025_WEB.pdf"
"tfl_quarterly_performance_report_q4_2024_25.pdf" = "https://content.tfl.gov.uk/tfl-quarterly-performance-report-q4-2024-25.pdf"

[llm]
extract_system_prompt = """You are an expert on work in UK public corporations and other public bodies, \
including public service broadcasting and media production, central banking and financial \
regulation, aviation regulation, public audit, rail and road infrastructure operation and \
maintenance, urban transport, mapping and geospatial data, and steelmaking, covering both \
operational and technical roles and corporate functions such as finance, HR, digital, legal \
and communications. Your job is to extract the tasks from a job advert and assess the \
automation potential of each with current AI systems."""
label_system_prompt = """You are an expert on work in UK public corporations and other public bodies. You classify \
tasks that were extracted from a job advert by how substantive each is to the role, so that \
non-meaningful items can be filtered out before analysis."""
