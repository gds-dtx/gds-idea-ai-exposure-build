"bbc_annual_report_2024_25.pdf" = "https://assets.publishing.service.gov.uk/media/6876519139d0452326e28ec7/BBC_Annual_Report___Accounts_24_25_final_accessible.pdf"
"boe_annual_report_2025.pdf" = "https://www.bankofengland.co.uk/-/media/boe/files/annual-report/2025/boe-2025.pdf"
"british_steel_socioeconomic_footprint_2026.pdf" = "https://www.britishsteel.co.uk/media/The-Socioeconomic-footprint-of-British-Steel-in-the-UK-2026.pdf"
