name = "NHS"
source = "NHS Jobs / TRAC adverts, 2020-2026 (UK-wide feed, England kept)"
owner = "DSIT AI exposure team"

[scoring]
primary_model = "gpt-oss-120b"
bedrock_model_id = "openai.gpt-oss-120b-1:0"
# Task extraction and scores from the 2026 Bedrock run (made by the original cleaning repo from
# the same cleaned adverts). Kept in raw/ as an input, not re-run. Not labelled.
stored_scores = "tasks_full.parquet"

[weighting]
primary_spec = "rake_1d"
target_source = "NHS Digital, NHS Workforce Statistics (HCHS), May 2026"
target_date = "2026-05-31"
# The rake uses adverts from these years (pay band is only reliably populated from 2021).
rake_years = [2021, 2022, 2023, 2024, 2025, 2026]
# 1D IPF only: NHS Digital does not publish the staff_group x region x grade joint.
dimensions = ["staff_group", "grade", "region"]
ipf_max_iter = 100
ipf_tol = 1e-6

[salary]
primary = "NHS Digital Staff Earnings Estimates, July 2026"
base_year = 2026   # advert salaries are uprated to this year for the sensitivity column
min_cell_sample = 30

# v1 adopts these pre-scaffold outputs (paths relative to settings.LEGACY_ROOT).
[releases]
v1 = "build"   # cleaned from raw here (2026-11-24); task scores are a stored input (see [scoring])

[raw]
# The NHS Jobs yearly exports (2019-2026, 10.7 GB) were uploaded straight to
# build/sector=nhs/release=v1/raw/ on 2026-10-27 (they have no older S3 copy). The stored task
# scores are copied in by `aie build nhs raw`.
files = ["NHS/extracted_data/tasks_full.parquet"]

# The yearly export the cleaning reads for each year (2019 is empty and not used).
[raw.year_files]
2020 = "10067031_job_advert_2020.csv"
2021 = "2021.csv"
2022 = "2022.csv"
2023 = "2023.csv"
2024 = "2024.csv"
2025 = "2025.csv"
2026 = "10067031_job_advert_2026.csv"

# What each raw file is. "processed" = an earlier repo's output kept as an input (flagged in
# raw/README.md, which `aie build nhs raw` writes).
[raw.notes."tasks_full.parquet"]
kind = "processed"
note = """PROCESSED, not raw: the tasks and gpt-oss-120b exposure scores from the 2026 Bedrock \
run by gds-idea-nhs-ai-exposure-cleaning (scripts/run_full.py), made from the same cleaned \
adverts the build now produces. Kept as an input so the LLM run is not repeated. Not labelled."""

[raw.notes."10067031_job_advert_2020.csv"]
kind = "original"
note = "NHS Jobs advert export for 2020, as received. Cleaned by sectors/nhs/cleaning.py."

[raw.notes."2021.csv"]
kind = "original"
note = "NHS Jobs advert export for 2021, as received. Cleaned by sectors/nhs/cleaning.py."

[raw.notes."2022.csv"]
kind = "original"
note = "NHS Jobs advert export for 2022, as received. Cleaned by sectors/nhs/cleaning.py."

[raw.notes."2023.csv"]
kind = "original"
note = "NHS Jobs advert export for 2023, as received. Cleaned by sectors/nhs/cleaning.py."

[raw.notes."2024.csv"]
kind = "original"
note = "NHS Jobs advert export for 2024, as received. Cleaned by sectors/nhs/cleaning.py."

[raw.notes."2025.csv"]
kind = "original"
note = "NHS Jobs advert export for 2025, as received. Cleaned by sectors/nhs/cleaning.py."

[raw.notes."10067031_job_advert_2026.csv"]
kind = "original"
note = "NHS Jobs advert export for 2026, as received. Cleaned by sectors/nhs/cleaning.py."

# Official statistics for this release, copied into build/sector=nhs/release=<r>/reference/.
[reference_sources]
"hchs_core1_may2026.csv" = "~/Documents/gds-idea-nhs-ai-exposure-raking/data/raw/Core 1. Staff group - England, NHSE region, ICS and org, May-26.csv"
"hchs_core6_may2026.csv" = "~/Documents/gds-idea-nhs-ai-exposure-raking/data/raw/Core 6. Staff group and grade - England, May-26.csv"
"earnings_estimates_jul2026.csv" = "~/Documents/gds-idea-nhs-ai-exposure-analysis/data/raw/earnings/monthly_earnings_estimates_jul2026.csv"
"earnings_by_band_jul2026.csv" = "~/Documents/gds-idea-nhs-ai-exposure-analysis/data/raw/earnings/monthly_earnings_by_band_grade_step_jul2026.csv"

[llm]
extract_system_prompt = """You are an expert on work in the UK NHS (National Health Service), across clinical, \
scientific, and administrative roles. Your job is to extract the tasks from a job advert and \
assess the automation potential of each with current AI systems."""
label_system_prompt = """You are an expert on work in the UK NHS. You classify tasks that were extracted from a \
job advert by how substantive each is to the role, so that non-meaningful items can be filtered \
out before analysis."""
