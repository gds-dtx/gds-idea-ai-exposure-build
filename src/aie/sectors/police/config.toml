name = "Police"
source = "Police force job boards (officer, staff and PCSO adverts), 2017-2026"
owner = "DSIT AI exposure team"

[scoring]
primary_model = "gpt-oss-120b"
bedrock_model_id = "openai.gpt-oss-120b-1:0"

[weighting]
# Police staff (incl. designated officers) + PCSOs, raked to Home Office FTE by force
# (sectors/police/workforce.py, docs/police_workforce.md). Officers, specials and
# volunteers are NOT raked: officer adverts are few, senior and mostly without salary.
primary_spec = "rake_force_staff"
target_measure = "fte"
min_unit_adverts = 30
target_source = "Home Office, Police workforce, England and Wales, open data table (workforce), published 2026-07-22"
target_date = "31 March 2026"
reference_file = "police_workforce_open_data_2026.ods"
ipf_max_iter = 100
ipf_tol = 1e-6

[reference_sources]
"police_workforce_open_data_2026.ods" = "https://assets.publishing.service.gov.uk/media/6a58d48c7eb057103bd945ba/open-data-table-police-workforce-220726.ods"

[salary]
primary = "advert salary range midpoint (no official pay source wired in yet)"

[releases]
v1 = "adopt"   # the existing outputs, mapped onto the curated contract
v2 = "adopt"   # same adverts and scores as v1; weights shared over adverts that state a salary (2026-11-09)

[release_settings.v2]
weight_on_salaried = true  # aie.build.weight_on_salaried; v1 basis kept as <spec>_all_adverts

[legacy]
vacancies = "police/extracted_data/vacancies_full.parquet"
tasks = "police/extracted_data/labelled_tasks_full.parquet"

[raw]
files = ["police/all_police_jobs_combined.csv"]

