name = "Police"
source = "Police force job boards (officer, staff and PCSO adverts), 2017-2026"
owner = "DSIT AI exposure team"

[scoring]
primary_model = "gpt-oss-120b"
bedrock_model_id = "openai.gpt-oss-120b-1:0"
# Task extraction, scores and labels from the October 2026 Bedrock run (made by the original
# cleaning repo from the same cleaned adverts). Kept in raw/ as an input, not re-run.
stored_scores = "labelled_tasks_full.parquet"

[weighting]
# Police staff (incl. designated officers) + PCSOs, raked to Home Office FTE by force
# (sectors/police/workforce.py, docs/police_workforce.md). Officers, specials and
# volunteers are NOT raked: officer adverts are few, senior and mostly without salary.
primary_spec = "rake_force_staff"
target_measure = "fte"
min_unit_adverts = 30
target_source = "Home Office, Police workforce, England and Wales, open data table (workforce), published 2026-07-22"
target_date = "31 March 2026"
reference_file = "police_workforce_open_data_2026.ods"
ipf_max_iter = 100
ipf_tol = 1e-6

[reference_sources]
"police_workforce_open_data_2026.ods" = "https://assets.publishing.service.gov.uk/media/6a58d48c7eb057103bd945ba/open-data-table-police-workforce-220726.ods"

[salary]
primary = "advert salary range midpoint (no official pay source wired in yet)"

[releases]
v1 = "build"   # cleaned from raw here (2026-11-24); task scores are a stored input (see [scoring])

[release_settings.v1]
weight_on_salaried = true  # since 2026-11-09 (aie.build.weight_on_salaried); earlier basis kept as <spec>_all_adverts

[raw]
# Copied once from the pre-scaffold folder; the build reads only these copies.
files = [
    "police/all_police_jobs_combined.csv",
    "police/extracted_data/labelled_tasks_full.parquet",
]

# What each raw file is. "processed" = an earlier repo's output kept as an input (flagged in
# raw/README.md, which `aie build police raw` writes).
[raw.notes."all_police_jobs_combined.csv"]
kind = "original"
note = "The scraped force job-board adverts, as received. Cleaned by sectors/police/cleaning.py."

[raw.notes."labelled_tasks_full.parquet"]
kind = "processed"
note = """PROCESSED, not raw: the tasks, gpt-oss-120b exposure scores and task labels from the \
October 2026 Bedrock run by gds-idea-police-ai-exposure-cleaning (scripts/run_full.py), made \
from the same cleaned adverts the build now produces. Kept as an input so the LLM run is not \
repeated; the prompts are the build's aie.llm prompts."""

